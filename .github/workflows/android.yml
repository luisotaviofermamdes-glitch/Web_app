name: Build Web_app APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and native build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "platform-tools"
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config python3-pip

      - name: Build real QEMU for Android arm64-v8a
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x vm/qemu/build-real-qemu-android.sh
          vm/qemu/build-real-qemu-android.sh
          QEMU="app/src/main/assets/vm/bin/qemu-system-x86_64"
          test -x "$QEMU"
          file "$QEMU"
          QEMU_SIZE=$(stat -c%s "$QEMU")
          echo "QEMU binary size: $QEMU_SIZE bytes"
          test "$QEMU_SIZE" -ge 1048576

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with QEMU included
        run: gradle assembleDebug --no-daemon

      - name: Verify APK contains real VM engine and is not the tiny wrapper build
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          QEMU="app/src/main/assets/vm/bin/qemu-system-x86_64"
          test -f "$APK"
          test -x "$QEMU"
          QEMU_SIZE=$(stat -c%s "$QEMU")
          APK_SIZE=$(stat -c%s "$APK")
          echo "QEMU size: $QEMU_SIZE bytes"
          echo "APK size: $APK_SIZE bytes"
          test "$QEMU_SIZE" -ge 1048576
          test "$APK_SIZE" -ge 1048576
          unzip -l "$APK" | grep -F 'assets/vm/bin/qemu-system-x86_64'

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Web_app.apk

      - name: Write build metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/Web_app.apk"
          SIZE=$(stat -c%s "$APK")
          printf 'apk=Web_app.apk\nsize_bytes=%s\ncommit=%s\nqemu=real-arm64\n' "$SIZE" "${GITHUB_SHA}" > app/build/outputs/apk/debug/Web_app-build.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Web_app-apk
          path: |
            app/build/outputs/apk/debug/Web_app.apk
            app/build/outputs/apk/debug/Web_app-build.txt
