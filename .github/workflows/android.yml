name: Build Web_app APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK is not the tiny wrapper build
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: APK is smaller than 1 MiB. A real VM build must contain native VM components and cannot be accepted as the final APK."
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Web_app.apk

      - name: Write build metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/Web_app.apk"
          SIZE=$(stat -c%s "$APK")
          printf 'apk=Web_app.apk\nsize_bytes=%s\ncommit=%s\n' "$SIZE" "${GITHUB_SHA}" > app/build/outputs/apk/debug/Web_app-build.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Web_app-apk
          path: |
            app/build/outputs/apk/debug/Web_app.apk
            app/build/outputs/apk/debug/Web_app-build.txt
