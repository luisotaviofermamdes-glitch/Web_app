name: Build real QEMU Android runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-qemu-android.sh'
      - 'vm/**'
      - '.github/workflows/build-qemu-android.yml'

jobs:
  build-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Web_app
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential ninja-build meson pkg-config cmake \
            python3 python3-pip python3-venv \
            autoconf automake libtool gettext flex bison \
            libglib2.0-dev libpixman-1-dev libslirp-dev \
            libfdt-dev libcap-dev libusb-1.0-0-dev \
            zip unzip rsync

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "platform-tools" "platforms;android-31" "ndk;29.0.13113456"

      - name: Build QEMU native runtime
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456
        run: |
          chmod +x scripts/build-qemu-android.sh
          ./scripts/build-qemu-android.sh

      - name: Verify real runtime size
        run: |
          test -x app/src/main/jniLibs/arm64-v8a/qemu-system-x86_64
          stat app/src/main/jniLibs/arm64-v8a/qemu-system-x86_64
          test "$(stat -c '%s' app/src/main/jniLibs/arm64-v8a/qemu-system-x86_64)" -ge 1048576

      - name: Package QEMU runtime
        run: |
          cd app/src/main/jniLibs
          zip -r "$GITHUB_WORKSPACE/qemu-android-arm64.zip" arm64-v8a

      - name: Upload QEMU runtime
        uses: actions/upload-artifact@v4
        with:
          name: qemu-android-arm64
          path: qemu-android-arm64.zip
          if-no-files-found: error
